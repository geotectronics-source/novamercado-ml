# NovaMercado — servicio de ML en producción.
#   cp .env.example .env      (y ajustar credenciales)
#   colocar los archivos publicados en ./datos/
#   docker compose up -d --build
name: novamercado

x-entorno-app: &entorno-app
  APP_DB_HOST: db
  APP_DB_PORT: "5432"
  APP_DB_NAME: ${APP_DB_NAME:?Defina APP_DB_NAME en .env}
  APP_DB_USER: ${APP_DB_USER:?Defina APP_DB_USER en .env}
  APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Defina APP_DB_PASSWORD en .env}
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MODELO_NOMBRE: novamercado_pronostico_ventas
  MODELO_ALIAS: vigente
  MLFLOW_EXPERIMENTO: novamercado_pronostico
  MARGEN_REEMPLAZO: ${MARGEN_REEMPLAZO:-0.01}
  GIT_PYTHON_REFRESH: quiet

x-airflow-comun: &airflow-comun
  build:
    context: .
    dockerfile: docker/airflow.Dockerfile
  image: novamercado-airflow:1.0.0
  environment: &entorno-airflow
    <<: *entorno-app
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:?}:${AIRFLOW_DB_PASSWORD:?}@db-airflow:5432/${AIRFLOW_DB_NAME:?}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?Defina AIRFLOW_SECRET_KEY en .env}
    AIRFLOW__WEBSERVER__WORKERS: "2"
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    CARPETA_TRABAJO: /opt/airflow/trabajo
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - airflow-logs:/opt/airflow/logs
    - airflow-trabajo:/opt/airflow/trabajo
  depends_on: &airflow-depende
    db-airflow:
      condition: service_healthy
    db:
      condition: service_healthy

services:
  # ------------------------------------------------------------------ base de datos del producto
  db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${APP_DB_NAME:?}
      POSTGRES_USER: ${APP_DB_USER:?}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?}
    volumes:
      - db-app-datos:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # ------------------------------------------------------------------ MLflow (tracking + registry)
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts --serve-artifacts
    volumes:
      - mlflow-datos:/mlflow
    ports:
      - "${MLFLOW_PUERTO_HOST:-5000}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # ------------------------------------------------------------------ carga inicial + primer modelo
  bootstrap:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: novamercado-app:1.0.0
    command: ["python", "-m", "novamercado.cli", "bootstrap"]
    environment:
      <<: *entorno-app
      CARPETA_DATOS: /datos
    volumes:
      - ./datos:/datos:ro
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    restart: on-failure:5

  # ------------------------------------------------------------------ API
  api:
    image: novamercado-app:1.0.0
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    environment:
      <<: *entorno-app
      AIRFLOW_URL: http://airflow-webserver:8080
      AIRFLOW_API_USER: ${AIRFLOW_ADMIN_USER:?}
      AIRFLOW_API_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?}
      DAG_REENTRENAMIENTO: reentrenamiento_modelo
      CARPETA_CACHE_MODELO: /cache_modelo
      INTERVALO_MONITOR_S: "15"
      INTERVALO_RECARGA_S: "20"
    volumes:
      - api-cache:/cache_modelo
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 40
    restart: unless-stopped

  # ------------------------------------------------------------------ Airflow (con su propia BD)
  db-airflow:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${AIRFLOW_DB_NAME:?}
      POSTGRES_USER: ${AIRFLOW_DB_USER:?}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?}
    volumes:
      - db-airflow-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  airflow-init:
    <<: *airflow-comun
    command: version
    environment:
      <<: *entorno-airflow
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:?}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?}
    restart: "no"

  airflow-webserver:
    <<: *airflow-comun
    command: webserver
    ports:
      - "${AIRFLOW_PUERTO_HOST:-8080}:8080"
    depends_on:
      <<: *airflow-depende
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-comun
    command: scheduler
    depends_on:
      <<: *airflow-depende
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  db-app-datos:
  db-airflow-datos:
  mlflow-datos:
  api-cache:
  airflow-logs:
  airflow-trabajo:
